name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Get UFCStats source data (pinned to the commit the committed model used)
        run: python -m src.fetch_data

      - name: Train (builds the dataset and the models the tests need)
        run: python -m src.train

      - name: Run the test suite (incl. leakage and model-quality gates)
        run: pytest -q
